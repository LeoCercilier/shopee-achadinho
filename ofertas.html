<style>
  :root {
    --bg: #0a0e17;
    --bg-elevated: #121826;
    --surface: #161f2e;
    --surface-hover: #1c2738;
    --border: rgba(255,255,255,.08);
    --text: #f1f5f9;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:

    z-index: 0;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10,14,23,.85);
    backdrop-filter: blur(16px);

    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }

  .topbar-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: -0.02em;
  }

  .brand-badge {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(145deg, #ff6b4a, var(--shopee));

    font-size: 18px;

    justify-content: center;

    min-height: 40px;

    margin: 0 auto;
    padding: 28px 16px 64px;
  }

  .hero {
    text-align: center;
    padding: 12px 0 28px;

  .hero-pill {

  .search-box {

    max-width: 520px;
    margin: 0 auto 20px;
    padding: 6px;
    background: var(--surface);

    padding: 12px 14px;

    height: 48px;

    border-radius: 12px;

  .status {

    min-height: 22px;
    margin-bottom: 18px;

  .status.loading { color: #7dd3fc; }

  .empty {
    display: none;
    text-align: center;
    padding: 48px 20px;

  .empty.show { display: block; }

  .card {

    border: 1px solid var(--border);

  .card-body {

    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .card-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    color: #e2e8f0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;

  }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    font-size: 12px;
    color: var(--muted);
  }

  .card-meta strong { color: #e2e8f0; font-weight: 700; }

  .card-price {
    font-size: 1.15rem;
    font-weight: 800;
    color: #fb923c;
    letter-spacing: -0.02em;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 4px;
  }

  .btn-shopee {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 40px;
    padding: 0 10px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #ff6b4a, var(--shopee));
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
    transition: filter .15s ease;
  }

  .btn-shopee:hover { filter: brightness(1.08); }
  .btn-shopee:disabled { opacity: .5; cursor: not-allowed; }

  .btn-share {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    transition: background .15s ease;
  }

  .btn-share:hover { background: var(--surface-hover); }

  .btn-more {
    display: none;
    width: 100%;
    max-width: 280px;
    margin: 28px auto 0;
    min-height: 48px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }

  .btn-more:hover {
    border-color: rgba(238,77,45,.4);
    background: var(--surface-hover);
  }

  .btn-more:disabled { opacity: .55; cursor: wait; }

  .footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: #64748b;
  }

  .footer a {
    color: #94a3b8;
    text-decoration: none;
  }

  .footer a:hover { color: var(--shopee); }
</style>
</head>

<script>
(function(){
"use strict";
var estado={pagina:1,limite:20,keyword:"",hasNext:false,carregando:false,produtos:[]};
var el={grid:document.getElementById("grid"),status:document.getElementById("status"),vazio:document.getElementById("vazio"),busca:document.getElementById("busca"),btnBuscar:document.getElementById("btnBuscar"),btnMais:document.getElementById("btnMais")};
function numero(v){if(v==null||v==="")return null;var n=Number(v);return Number.isFinite(n)?n:null}
function moeda(v){var n=numero(v);if(n==null)return"Confira o preco";return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function formatarNumero(v){var n=numero(v);return n==null?null:n.toLocaleString("pt-BR")}
function escapar(t){return String(t||"").replace(/&/g,"&"+"amp;").replace(/</g,"&"+"lt;").replace(/>/g,"&"+"gt;").replace(/"/g,"&"+"quot;")}
function chaveProduto(p){if(!p)return"";if(p.id)return"id:"+String(p.id);if(p.link){try{var u=new URL(p.link,location.href);var iid=u.searchParams.get("itemid")||u.searchParams.get("itemId")||u.searchParams.get("product_id");if(iid)return"id:"+iid}catch(e){}return"link:"+String(p.link).split("?")[0]}return"nome:"+String(p.nome||"").toLowerCase().trim()+"|"+String(p.preco||"")}
function coletarImagens(p){var imgs=[];function add(u){if(!u||typeof u!=="string")return;u=u.trim();if(!u)return;if(imgs.indexOf(u)===-1)imgs.push(u)}add(p.imagem_url);add(p.imageUrl);add(p.image);add(p.thumbnail);if(Array.isArray(p.images))p.images.forEach(function(x){if(typeof x==="string")add(x);else if(x&&x.url)add(x.url)});if(Array.isArray(p.imageUrlList))p.imageUrlList.forEach(add);if(Array.isArray(p.imagens))p.imagens.forEach(function(x){if(typeof x==="string")add(x);else if(x&&x.url)add(x.url)});return imgs.slice(0,2)}
function normalizarProduto(p){if(!p||typeof p!=="object")return null;var id=p.item_id||p.itemId||p.product_id||p.productId||p.itemid||p.id||"";var imgs=coletarImagens(p);return{id:id?String(id):"",nome:p.nome||p.productName||"Produto",imagem_url:imgs[0]||p.imagem_url||p.imageUrl||"",imagens:imgs,preco:p.preco!=null?p.preco:(p.priceMin!=null?p.priceMin:p.preco_min),vendas:p.vendas!=null?p.vendas:p.sales,avaliacao:p.avaliacao!=null?p.avaliacao:p.ratingStar,desconto:p.desconto_percentual!=null?p.desconto_percentual:p.priceDiscountRate,link:p.offer_link||p.offerLink||p.produto_link||p.productLink||""}}
function deduplicarProdutos(lista,existentes){existentes=existentes||[];var vistos={};for(var i=0;i<existentes.length;i++)vistos[chaveProduto(existentes[i])]=true;var out=[];for(var j=0;j<lista.length;j++){var p=lista[j];if(!p||!p.nome)continue;var k=chaveProduto(p);if(vistos[k])continue;vistos[k]=true;out.push(p)}return out}
function setStatus(msg,tipo){el.status.textContent=msg||"";el.status.className="status"+(tipo?" "+tipo:"")}
async function baixarImagensComoArquivos(urls){var files=[];for(var i=0;i<urls.length&&files.length<2;i++){try{var resp=await fetch(urls[i],{mode:"cors"});if(!resp.ok)continue;var blob=await resp.blob();if(!blob||!blob.type||blob.type.indexOf("image/")!==0)continue;var ext=(blob.type.split("/")[1]||"jpg").replace("jpeg","jpg");files.push(new File([blob],"produto-"+(files.length+1)+"."+ext,{type:blob.type}))}catch(e){}}return files}
async function compartilharProduto(produto,botao){var nome=produto.nome||"Produto";var precoTxt=moeda(produto.preco);var link=produto.link||"";var texto=nome+"\n"+precoTxt+"\n"+link;var urls=[];if(produto.imagens&&produto.imagens.length)urls=produto.imagens.slice(0,2);else if(produto.imagem_url)urls=[produto.imagem_url];try{if(navigator.share){var files=await baixarImagensComoArquivos(urls);var payload={title:nome,text:texto,url:link};if(files.length&&navigator.canShare&&navigator.canShare({files:files})){payload.files=files}await navigator.share(payload);return}}catch(err){if(err&&err.name==="AbortError")return}try{await navigator.clipboard.writeText(texto);botao.textContent="✅";botao.classList.add("copied");setTimeout(function(){botao.textContent="📤";botao.classList.remove("copied")},1800)}catch(e){alert(texto)}}
function criarCard(produto){var card=document.createElement("article");card.className="card";var nome=produto.nome,img=produto.imagem_url,preco=moeda(produto.preco),link=produto.link,av=numero(produto.avaliacao),vendas=formatarNumero(produto.vendas),desconto=numero(produto.desconto);var imgHtml=img?'<img src="'+escapar(img)+'" alt="'+escapar(nome)+'" loading="lazy" onerror="this.style.display=\'none\'">':'<div style="font-size:40px">📦</div>';var descontoHtml=(desconto!=null&&desconto>0)?'<div class="discount">-'+Math.round(desconto)+'%</div>':'';var metaParts=[];if(av!=null)metaParts.push('⭐ <strong>'+av.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})+'</strong>');if(vendas)metaParts.push('🛒 <strong>'+vendas+'</strong>');var shopeeBtn=link?'<a class="btn-shopee" href="'+escapar(link)+'" target="_blank" rel="noopener noreferrer sponsored">🛍️ Ver na Shopee</a>':'<button type="button" class="btn-shopee" disabled>Indisponivel</button>';var shareBtn=link?'<button type="button" class="btn-share" aria-label="Compartilhar">📤</button>':'';card.innerHTML='<div class="card-image">'+imgHtml+descontoHtml+'</div><div class="card-body"><div class="card-name">'+escapar(nome)+'</div>'+(metaParts.length?'<div class="card-meta">'+metaParts.join('')+'</div>':'')+'<div class="card-price">'+escapar(preco)+'</div><div class="card-actions">'+shopeeBtn+shareBtn+'</div></div>';if(link){var btnShare=card.querySelector('.btn-share');if(btnShare)btnShare.addEventListener('click',function(e){e.preventDefault();compartilharProduto(produto,btnShare)})}return card}
function renderizar(acumular){if(!acumular)el.grid.innerHTML="";var f=document.createDocumentFragment();var inicio=acumular?el.grid.children.length:0;for(var i=inicio;i<estado.produtos.length;i++)f.appendChild(criarCard(estado.produtos[i]));el.grid.appendChild(f);el.vazio.classList.toggle('show',estado.produtos.length===0);el.btnMais.style.display=estado.hasNext?'block':'none'}
function extrairLista(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.products))return data.products;if(data&&Array.isArray(data.produtos))return data.produtos;if(data&&Array.isArray(data.data))return data.data;return[]}
function extrairHasNext(data){return !!(data&&(data.hasNextPage||(data.pageInfo&&data.pageInfo.hasNextPage)))}
async function garantirSessaoPublica(){var atual=await supabaseClient.auth.getSession();if(atual&&atual.data&&atual.data.session&&atual.data.session.access_token)return atual.data.session.access_token;var anon=await supabaseClient.auth.signInAnonymously();if(anon.error)throw new Error('Acesso publico nao configurado. Ative Authentication > Providers > Anonymous no Supabase.');var token=anon.data&&anon.data.session&&anon.data.session.access_token;if(!token)throw new Error('Nao foi possivel criar sessao publica.');return token}
async function buscar(opcoes){opcoes=opcoes||{};if(estado.carregando)return;if(typeof supabaseClient==="undefined"){setStatus('Config indisponivel','error');return}estado.carregando=true;el.btnBuscar.disabled=true;el.btnMais.disabled=true;setStatus('Carregando ofertas...','loading');var pagina=Number(opcoes.pagina||estado.pagina||1);var acumular=!!opcoes.acumular;try{var accessToken=await garantirSessaoPublica();var resultado=await supabaseClient.functions.invoke('shopee-products-v2',{body:{page:pagina,limit:estado.limite,keyword:estado.keyword||''},headers:{Authorization:'Bearer '+accessToken}});if(resultado.error){var mensagem=resultado.error.message||'Erro ao carregar';try{if(resultado.error.context&&typeof resultado.error.context.json==='function'){var corpo=await resultado.error.context.json();mensagem=corpo.message||corpo.error||mensagem}}catch(e){}throw new Error(mensagem)}var data=resultado.data;if(data&&(data.error||data.message)&&!extrairLista(data).length){var apiMsg=String(data.error||data.message||'');if(/sessao|session|bearer|token|auth|jwt|login/i.test(apiMsg))throw new Error('A API ainda exige login. Ative Anonymous no Supabase.');throw new Error(apiMsg)}var lista=deduplicarProdutos(extrairLista(data).map(normalizarProduto).filter(function(p){return p&&p.nome}),acumular?estado.produtos:[]);estado.pagina=pagina;estado.hasNext=extrairHasNext(data);estado.produtos=acumular?estado.produtos.concat(lista):lista;renderizar(acumular);if(lista.length===0&&!acumular)setStatus('Nenhuma oferta encontrada.');else setStatus(estado.produtos.length+' oferta'+(estado.produtos.length===1?'':'s')+(estado.keyword?' para "'+estado.keyword+'"':''))}catch(erro){console.error(erro);var msg=(erro&&erro.message)?erro.message:'Falha ao carregar';if(/anonymous|Anonymous|Acesso publico/i.test(msg))setStatus('Ative Authentication > Providers > Anonymous no Supabase.','error');else if(/JWT|auth|session|login|Bearer|Sessao|401|403/i.test(msg))setStatus('A API exige sessao. Ative Anonymous no Supabase.','error');else setStatus(msg,'error');if(!acumular){estado.produtos=[];renderizar(false)}}finally{estado.carregando=false;el.btnBuscar.disabled=false;el.btnMais.disabled=false}}
function executarBusca(){estado.keyword=(el.busca.value||'').trim();estado.pagina=1;buscar({pagina:1,acumular:false})}
el.btnBuscar.addEventListener('click',executarBusca);
el.busca.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();executarBusca()}});
el.btnMais.addEventListener('click',function(){if(!estado.hasNext||estado.carregando)return;buscar({pagina:estado.pagina+1,acumular:true})});
buscar({pagina:1,acumular:false});
})();
</script>
